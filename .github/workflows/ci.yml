name: CI

on:
  push:
  pull_request:

jobs:
  build:
    name: Build (Linux amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Vet
        run: go vet ./...

      - name: Build
        env:
          CGO_ENABLED: 0
          GOOS: linux
          GOARCH: amd64
        run: go build -o output/apm-api .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: apm-api-linux-amd64
          path: output/apm-api
